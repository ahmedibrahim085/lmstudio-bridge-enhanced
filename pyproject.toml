[project]
name = "lmstudio-bridge-enhanced"
version = "5.1.0"
description = "Enhanced MCP bridge for LM Studio with local LLM orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ahmed Maged"}
]
keywords = ["mcp", "lm-studio", "llm", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/AhmedMaged/lmstudio-bridge-enhanced"
Repository = "https://github.com/AhmedMaged/lmstudio-bridge-enhanced"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (includes E722: bare except)
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S110",   # flake8-bandit: try-except-pass (silent swallowing)
    "S112",   # flake8-bandit: try-except-continue (silent swallowing)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "UP006",  # Use `list` instead of `List` — bulk modernization deferred
    "UP035",  # `typing.List` deprecated — bulk modernization deferred
    "E402",   # module-level import not at top — by design (sys.path, conditional)
    "F403",   # wildcard imports — by design in config/constants/__init__.py
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "llm", "mcp_client", "tools", "utils", "model_registry"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Too strict for existing codebase
check_untyped_defs = true
ignore_missing_imports = true

# NOTE: When pytest.ini exists, [tool.pytest.ini_options] is ignored by pytest.
# Keep this section in sync with pytest.ini for IDE tooling that reads pyproject.toml.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "mcp: marks tests that require MCP servers",
    "integration: marks integration tests",
    "e2e: marks tests as end-to-end tests (require running LM Studio)",
    "flaky: marks tests as flaky (eligible for targeted reruns)",
    "model_required: marks tests that require a specific model loaded",
    "unit: marks tests as pure unit tests (no external dependencies)",
]
