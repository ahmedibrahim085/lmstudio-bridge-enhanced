[pytest]
# Register custom markers to avoid warnings
markers =
    e2e: marks tests as end-to-end tests (require running LM Studio)
    slow: marks tests as slow running tests
    integration: marks tests as integration tests
    mcp: marks tests that require MCP servers
    flaky: marks tests as flaky (eligible for targeted reruns via pytest-rerunfailures)
    model_required: marks tests that require a specific model loaded in LM Studio
    unit: marks tests as pure unit tests (no external dependencies)

# Async mode for pytest-asyncio
asyncio_mode = auto

# NOTE: Global --reruns removed. Use @pytest.mark.flaky(reruns=N) on individual tests.
# This prevents tripling every failure (was 926x3 for OOM errors).
